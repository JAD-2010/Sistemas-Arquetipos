<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patitas & Bigotes - Agenda de Peluquería Canina</title>
  
  <!-- Carga de React, ReactDOM y Babel desde CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       ESTILOS CSS ROSA PASTEL Y ANIMACIONES
       ========================================= */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-25px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes modalBounce {
      0% { opacity: 0; transform: scale(0.88); }
      70% { transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Inter', sans-serif;
    }

    body {
      background-color: #fff0f5;
      color: #4a2e35;
    }

    .layout {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    .toggle-sidebar-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 100;
      background-color: #f472b6;
      color: #ffffff;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.3);
      transition: all 0.25s ease;
    }

    .toggle-sidebar-btn:hover {
      background-color: #ec4899;
      transform: scale(1.05);
    }

    .sidebar {
      width: 230px;
      background: linear-gradient(180deg, #fbcfe8 0%, #f472b6 100%);
      color: #831843;
      padding: 20px 12px;
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 99;
      box-shadow: 4px 0 16px rgba(244, 114, 182, 0.2);
      animation: slideInLeft 0.3s ease;
    }

    .logo-container {
      margin-top: 45px;
      margin-bottom: 20px;
      text-align: center;
    }

    .logo-container h2 {
      font-size: 1.2rem;
      color: #831843;
      font-weight: 800;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu button {
      background: transparent;
      border: none;
      color: #831843;
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .menu button.active, .menu button:hover {
      background-color: #ffffff;
      color: #db2777;
      transform: translateX(4px);
      box-shadow: 0 4px 10px rgba(236, 72, 153, 0.15);
    }

    .content {
      flex: 1;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      animation: fadeIn 0.35s ease;
    }

    .main-title {
      color: #9d174d;
      font-size: 2rem;
      font-weight: 800;
      margin-top: 8px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 22px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 6px 20px rgba(244, 114, 182, 0.12);
      border: 1.5px solid #fce7f3;
    }

    .card-title {
      text-align: center;
      color: #831843;
      margin-bottom: 18px;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .form-prestamo {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-group label {
      font-size: 0.88rem;
      color: #831843;
      font-weight: 700;
    }

    select, input[type="text"], input[type="time"] {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #fbcfe8;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #4a2e35;
      background-color: #fffafc;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, input:focus {
      border-color: #f472b6;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.25);
    }

    .select-con-agregar {
      display: flex;
      gap: 8px;
    }

    .btn-agregar-inline {
      background-color: #f472b6;
      color: #ffffff;
      border: none;
      width: 48px;
      border-radius: 10px;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-agregar-inline:hover {
      background-color: #ec4899;
    }

    .btn-primary {
      background-color: #f472b6;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.3);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #ec4899;
      transform: translateY(-2px);
    }

    .btn-whatsapp {
      background-color: #25d366;
      color: #ffffff;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .btn-whatsapp:hover {
      transform: scale(1.08);
      background-color: #1ebd56;
    }

    .filtros-rapidos {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .btn-filtro {
      background-color: #fff0f5;
      border: 1px solid #fbcfe8;
      color: #831843;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .btn-filtro.active, .btn-filtro:hover {
      background-color: #f472b6;
      color: #ffffff;
      border-color: #f472b6;
    }

    .tabla-responsive {
      overflow-x: auto;
    }

    .tabla-prestamos {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 6px;
    }

    .tabla-prestamos th {
      background-color: #fce7f3;
      color: #831843;
      padding: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 6px;
    }

    .tabla-prestamos td {
      background-color: #fffafc;
      padding: 10px;
      text-align: center;
      font-size: 0.88rem;
      border-top: 1px solid #fce7f3;
      border-bottom: 1px solid #fce7f3;
    }

    .dueno-sub {
      color: #9d174d;
      font-size: 0.78rem;
    }

    .nota-alerta {
      display: inline-block;
      background-color: #fef2f2;
      color: #991b1b;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 2px;
    }

    .select-estado {
      border-radius: 6px;
      padding: 6px;
      font-weight: 700;
      font-size: 0.8rem;
      border: none;
      cursor: pointer;
    }

    .badge-en-espera { background-color: #fecdd3; color: #9f1239; }
    .badge-en-servicio { background-color: #fef08a; color: #854d0e; }
    .badge-listo { background-color: #e0f2fe; color: #0369a1; }
    .badge-completado { background-color: #dcfce7; color: #15803d; }

    .btn-eliminar-alumno {
      background: transparent;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(131, 24, 67, 0.4);
      backdrop-filter: blur(3px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    .modal-card {
      background: #ffffff;
      padding: 22px;
      border-radius: 16px;
      width: 92%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(131, 24, 67, 0.2);
      border: 1.5px solid #fbcfe8;
      animation: modalBounce 0.3s ease;
    }

    .form-modal-alumno {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-curso-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .modal-botones {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .modal-botones button {
      flex: 1;
    }

    .btn-celeste {
      background-color: #fce7f3;
      color: #831843;
      border: 1px solid #fbcfe8;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <!-- APLICACIÓN REACT EN BABEL -->
  <script type="text/babel">
    const { useState } = React;

    function PatitasBigotes() {
      const [sidebarVisible, setSidebarVisible] = useState(false);
      const [vistaActual, setVistaActual] = useState('inicio');

      const [mascotas, setMascotas] = useState([
        { id: 1, nombreMascota: 'Rocco', tipo: 'Perro', raza: 'Caniche', dueno: 'Laura Giménez', telefono: '3515550192', notas: 'Sensible al secador fuerte' },
        { id: 2, nombreMascota: 'Michi', tipo: 'Gato', raza: 'Persa', dueno: 'Carlos Ruiz', telefono: '3515550833', notas: 'Usar champú neutro (alergia)' },
        { id: 3, nombreMascota: 'Thor', tipo: 'Perro', raza: 'Golden Retriever', dueno: 'Sofía Peralta', telefono: '3515550411', notas: 'Muy amigable, le gusta el agua' }
      ]);

      const [servicios] = useState([
        'Corte & Baño Completo',
        'Baño Sanitario',
        'Corte de Uñas y Limpieza',
        'Desparasitado & Baño'
      ]);

      const [busquedaMascota, setBusquedaMascota] = useState('');
      const [mostrarModalMascota, setMostrarModalMascota] = useState(false);

      const [nuevoNombreMascota, setNuevoNombreMascota] = useState('');
      const [nuevoTipo, setNuevoTipo] = useState('Perro');
      const [nuevaRaza, setNuevaRaza] = useState('');
      const [nuevoDueno, setNuevoDueno] = useState('');
      const [nuevoTelefono, setNuevoTelefono] = useState('');
      const [nuevasNotas, setNuevasNotas] = useState('');

      const [mascotaSeleccionada, setMascotaSeleccionada] = useState('');
      const [servicioSeleccionado, setServicioSeleccionado] = useState('');
      const [horaTurno, setHoraTurno] = useState('');

      const [filtroEstado, setFiltroEstado] = useState('TODOS');

      const [turnos, setTurnos] = useState([
        { id: 1, mascota: 'Rocco (Caniche)', dueno: 'Laura Giménez', telefono: '3515550192', servicio: 'Corte & Baño Completo', hora: '09:00', estado: 'COMPLETADO', notas: 'Sensible al secador' },
        { id: 2, mascota: 'Michi (Persa)', dueno: 'Carlos Ruiz', telefono: '3515550833', servicio: 'Corte de Uñas y Limpieza', hora: '10:30', estado: 'EN_SERVICIO', notas: 'Alergia champú' },
        { id: 3, mascota: 'Thor (Golden)', dueno: 'Sofía Peralta', telefono: '3515550411', servicio: 'Baño Sanitario', hora: '11:45', estado: 'EN_ESPERA', notas: 'Sin observaciones' }
      ]);

      const obtenerInfoEstado = (estado) => {
        switch (estado) {
          case 'EN_ESPERA':
            return { texto: 'En Espera', icono: '🚨', clase: 'en-espera', prioridad: 1 };
          case 'EN_SERVICIO':
            return { texto: 'En Servicio', icono: '⚠️', clase: 'en-servicio', prioridad: 2 };
          case 'LISTO':
            return { texto: 'Listo p/ Retirar', icono: '⏱️', clase: 'listo', prioridad: 3 };
          case 'COMPLETADO':
            return { texto: 'Completado', icono: '✅', clase: 'completado', prioridad: 4 };
          default:
            return { texto: 'En Espera', icono: '🚨', clase: 'en-espera', prioridad: 1 };
        }
      };

      const turnosFiltrados = [...turnos]
        .sort((a, b) => obtenerInfoEstado(a.estado).prioridad - obtenerInfoEstado(b.estado).prioridad)
        .filter((t) => {
          if (filtroEstado === 'TODOS') return true;
          return t.estado === filtroEstado;
        });

      const handleAgregarMascota = (e) => {
        if (e) e.preventDefault();
        if (!nuevoNombreMascota.trim() || !nuevoDueno.trim()) return;

        const nuevaMascotaObj = {
          id: Date.now(),
          nombreMascota: nuevoNombreMascota.trim(),
          tipo: nuevoTipo,
          raza: nuevaRaza.trim() || 'Sin raza',
          dueno: nuevoDueno.trim(),
          telefono: nuevoTelefono.trim() || '',
          notas: nuevasNotas.trim() || 'Sin observaciones'
        };

        setMascotas([...mascotas, nuevaMascotaObj]);
        setMascotaSeleccionada(`${nuevaMascotaObj.nombreMascota} (${nuevaMascotaObj.raza})`);

        setNuevoNombreMascota('');
        setNuevoTipo('Perro');
        setNuevaRaza('');
        setNuevoDueno('');
        setNuevoTelefono('');
        setNuevasNotas('');
        setMostrarModalMascota(false);
      };

      const handleEliminarMascota = (id) => {
        if (window.confirm('¿Eliminar esta mascota del registro?')) {
          setMascotas(mascotas.filter((m) => m.id !== id));
        }
      };

      const handleGuardarTurno = (e) => {
        e.preventDefault();
        if (!mascotaSeleccionada || !servicioSeleccionado || !horaTurno) return;

        const mascotaObj = mascotas.find(
          (m) => `${m.nombreMascota} (${m.raza})` === mascotaSeleccionada
        );

        setTurnos([
          {
            id: Date.now(),
            mascota: mascotaSeleccionada,
            dueno: mascotaObj ? mascotaObj.dueno : 'Cliente',
            telefono: mascotaObj ? mascotaObj.telefono : '',
            notas: mascotaObj ? mascotaObj.notas : 'Sin observaciones',
            servicio: servicioSeleccionado,
            hora: horaTurno,
            estado: 'EN_ESPERA'
          },
          ...turnos
        ]);

        setMascotaSeleccionada('');
        setServicioSeleccionado('');
        setHoraTurno('');
      };

      const handleCambiarEstadoTurno = (id, nuevoEstado) => {
        setTurnos(
          turnos.map((t) => (t.id === id ? { ...t, estado: nuevoEstado } : t))
        );
      };

      const abrirWhatsApp = (telefono, mascota, estado) => {
        if (!telefono) {
          alert('Esta mascota no tiene un número registrado');
          return;
        }
        let mensaje = `Hola! Te escribimos de Peluquería Patitas & Bigotes 🐾. `;
        if (estado === 'LISTO') {
          mensaje += `${mascota} ya está listo/a para que lo pases a retirar! 😊`;
        } else {
          mensaje += `Te contactamos por el turno de ${mascota}.`;
        }
        const url = `https://wa.me/${telefono.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
      };

      const mascotasFiltradas = mascotas.filter((m) => {
        const termino = busquedaMascota.toLowerCase();
        return (
          m.nombreMascota.toLowerCase().includes(termino) ||
          m.dueno.toLowerCase().includes(termino) ||
          m.raza.toLowerCase().includes(termino)
        );
      });

      return (
        <div className="layout">
          <button
            className="toggle-sidebar-btn"
            onClick={() => setSidebarVisible(!sidebarVisible)}
          >
            ☰ Menú
          </button>

          {sidebarVisible && (
            <aside className="sidebar">
              <div className="logo-container">
                <h2>🐾 Patitas & Bigotes</h2>
              </div>

              <nav className="menu">
                <button
                  className={vistaActual === 'inicio' ? 'active' : ''}
                  onClick={() => { setVistaActual('inicio'); setSidebarVisible(false); }}
                >
                  <span>📅</span> Turnos del Día
                </button>
                <button
                  className={vistaActual === 'mascotas' ? 'active' : ''}
                  onClick={() => { setVistaActual('mascotas'); setSidebarVisible(false); }}
                >
                  <span>🐶</span> Clientes & Mascotas
                </button>
              </nav>
            </aside>
          )}

          <main className="content">
            <h1 className="main-title">Patitas & Bigotes</h1>

            {vistaActual === 'inicio' && (
              <>
                <div className="card">
                  <h2 className="card-title">Agendar Turno Rápido</h2>
                  <form onSubmit={handleGuardarTurno} className="form-prestamo">
                    <div className="field-group">
                      <label>Mascota / Cliente</label>
                      <div className="select-con-agregar">
                        <select
                          value={mascotaSeleccionada}
                          onChange={(e) => setMascotaSeleccionada(e.target.value)}
                        >
                          <option value="">Seleccionar mascota</option>
                          {mascotas.map((m) => (
                            <option key={m.id} value={`${m.nombreMascota} (${m.raza})`}>
                              {m.nombreMascota} - {m.dueno} ({m.tipo})
                            </option>
                          ))}
                        </select>
                        <button
                          type="button"
                          className="btn-agregar-inline"
                          onClick={() => setMostrarModalMascota(true)}
                        >
                          +
                        </button>
                      </div>
                    </div>

                    <div className="field-group">
                      <label>Servicio Solicatado</label>
                      <select
                        value={servicioSeleccionado}
                        onChange={(e) => setServicioSeleccionado(e.target.value)}
                      >
                        <option value="">Seleccionar servicio</option>
                        {servicios.map((s, idx) => (
                          <option key={idx} value={s}>{s}</option>
                        ))}
                      </select>
                    </div>

                    <div className="field-group">
                      <label>Hora del Turno</label>
                      <input
                        type="time"
                        value={horaTurno}
                        onChange={(e) => setHoraTurno(e.target.value)}
                      />
                    </div>

                    <button type="submit" className="btn-primary">
                      Agendar Turno
                    </button>
                  </form>
                </div>

                <div className="card card-tabla">
                  <h2 className="card-title">Agenda del Día</h2>

                  <div className="filtros-rapidos">
                    <button
                      className={`btn-filtro ${filtroEstado === 'TODOS' ? 'active' : ''}`}
                      onClick={() => setFiltroEstado('TODOS')}
                    >
                      Todos
                    </button>
                    <button
                      className={`btn-filtro ${filtroEstado === 'EN_ESPERA' ? 'active' : ''}`}
                      onClick={() => setFiltroEstado('EN_ESPERA')}
                    >
                      🚨 En Espera
                    </button>
                    <button
                      className={`btn-filtro ${filtroEstado === 'EN_SERVICIO' ? 'active' : ''}`}
                      onClick={() => setFiltroEstado('EN_SERVICIO')}
                    >
                      ⚠️ En Servicio
                    </button>
                    <button
                      className={`btn-filtro ${filtroEstado === 'LISTO' ? 'active' : ''}`}
                      onClick={() => setFiltroEstado('LISTO')}
                    >
                      ⏱️ Listos
                    </button>
                  </div>

                  <div className="tabla-responsive">
                    <table className="tabla-prestamos">
                      <thead>
                        <tr>
                          <th>Hora</th>
                          <th>Mascota & Notas</th>
                          <th>Servicio</th>
                          <th>Estado</th>
                          <th>Aviso WA</th>
                        </tr>
                      </thead>
                      <tbody>
                        {turnosFiltrados.map((t) => {
                          const st = obtenerInfoEstado(t.estado);
                          return (
                            <tr key={t.id}>
                              <td><strong>{t.hora} hs</strong></td>
                              <td style={{ textAlign: 'left' }}>
                                <strong>{t.mascota}</strong><br />
                                <small className="dueno-sub">{t.dueno}</small><br />
                                <span className="nota-alerta">💡 {t.notas}</span>
                              </td>
                              <td>{t.servicio}</td>
                              <td>
                                <select
                                  value={t.estado}
                                  onChange={(e) => handleCambiarEstadoTurno(t.id, e.target.value)}
                                  className={`select-estado badge-${st.clase}`}
                                >
                                  <option value="EN_ESPERA">🚨 En Espera</option>
                                  <option value="EN_SERVICIO">⚠️ En Servicio</option>
                                  <option value="LISTO">⏱️ Listo p/ Retirar</option>
                                  <option value="COMPLETADO">✅ Completado</option>
                                </select>
                              </td>
                              <td>
                                <button
                                  className="btn-whatsapp"
                                  onClick={() => abrirWhatsApp(t.telefono, t.mascota, t.estado)}
                                  title="Enviar mensaje de WhatsApp"
                                >
                                  💬 WA
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </>
            )}

            {vistaActual === 'mascotas' && (
              <div className="card card-tabla">
                <h2 className="card-title">Clientes & Mascotas</h2>

                <button
                  className="btn-primary"
                  style={{ marginBottom: '16px' }}
                  onClick={() => setMostrarModalMascota(true)}
                >
                  + Registrar Nueva Mascota
                </button>

                <div className="header-tabla-alumnos">
                  <input
                    type="text"
                    placeholder="🔍 Buscar mascota, dueño o raza..."
                    value={busquedaMascota}
                    onChange={(e) => setBusquedaMascota(e.target.value)}
                    className="input-buscar-alumno"
                  />
                </div>

                <div className="tabla-responsive">
                  <table className="tabla-prestamos">
                    <thead>
                      <tr>
                        <th>Mascota</th>
                        <th>Raza</th>
                        <th>Dueño / Teléfono</th>
                        <th>Observaciones</th>
                        <th>Acción</th>
                      </tr>
                    </thead>
                    <tbody>
                      {mascotasFiltradas.length > 0 ? (
                        mascotasFiltradas.map((m) => (
                          <tr key={m.id}>
                            <td><strong>{m.nombreMascota}</strong> ({m.tipo})</td>
                            <td>{m.raza}</td>
                            <td>
                              {m.dueno}<br />
                              <small>{m.telefono || 'Sin tel.'}</small>
                            </td>
                            <td><span className="nota-alerta">{m.notas}</span></td>
                            <td>
                              <button
                                className="btn-eliminar-alumno"
                                onClick={() => handleEliminarMascota(m.id)}
                              >
                                🗑️
                              </button>
                            </td>
                          </tr>
                        ))
                      ) : (
                        <tr>
                          <td colSpan="5" style={{ textAlign: 'center', padding: '16px' }}>
                            No se encontraron mascotas.
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {mostrarModalMascota && (
            <div className="modal-overlay">
              <div className="modal-card">
                <h3 className="card-title">Nueva Mascota</h3>
                <form onSubmit={handleAgregarMascota} className="form-modal-alumno">
                  <div className="field-group">
                    <label>Nombre Mascota</label>
                    <input
                      type="text"
                      placeholder="Ej. Rocco"
                      value={nuevoNombreMascota}
                      onChange={(e) => setNuevoNombreMascota(e.target.value)}
                      required
                    />
                  </div>

                  <div className="modal-curso-grid">
                    <div className="field-group">
                      <label>Tipo</label>
                      <select value={nuevoTipo} onChange={(e) => setNuevoTipo(e.target.value)}>
                        <option value="Perro">Perro 🐶</option>
                        <option value="Gato">Gato 🐱</option>
                      </select>
                    </div>
                    <div className="field-group">
                      <label>Raza</label>
                      <input
                        type="text"
                        placeholder="Ej. Caniche"
                        value={nuevaRaza}
                        onChange={(e) => setNuevaRaza(e.target.value)}
                      />
                    </div>
                  </div>

                  <div className="field-group">
                    <label>Nombre Dueño</label>
                    <input
                      type="text"
                      placeholder="Ej. Laura Giménez"
                      value={nuevoDueno}
                      onChange={(e) => setNuevoDueno(e.target.value)}
                      required
                    />
                  </div>

                  <div className="field-group">
                    <label>WhatsApp Contacto</label>
                    <input
                      type="text"
                      placeholder="Ej. 3515550192"
                      value={nuevoTelefono}
                      onChange={(e) => setNuevoTelefono(e.target.value)}
                    />
                  </div>

                  <div className="field-group">
                    <label>Alergias o Notas de Conducta</label>
                    <input
                      type="text"
                      placeholder="Ej. Alergia champú, muerde secador..."
                      value={nuevasNotas}
                      onChange={(e) => setNuevasNotas(e.target.value)}
                    />
                  </div>

                  <div className="modal-botones">
                    <button type="submit" className="btn-primary">
                      Guardar
                    </button>
                    <button
                      type="button"
                      className="btn-celeste"
                      onClick={() => setMostrarModalMascota(false)}
                    >
                      Cancelar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PatitasBigotes />);
  </script>
</body>
</html>
